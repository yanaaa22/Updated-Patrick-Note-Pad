<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrick's Blue Star Notes</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #0284c7 0%, #0369a1 40%, #0c4a6e 100%);
            --card-bg: #e0f2fe;
            --inner-card: #ffffff;
            --main-blue: #0284c7;
            --text-dark: #0f172a;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Fully Responsive Container */
        .container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        @media (min-width: 768px) {
            .container {
                max-width: 640px;
            }
        }

        /* Custom Colored Vector Icons */
        .ocean-icon {
            width: 20px;
            height: 20px;
            display: inline-block;
            vertical-align: middle;
            flex-shrink: 0;
        }

        /* Banner Card */
        .banner-card {
            background: #e0f2fe;
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            position: relative;
            border: 2px solid #bae6fd;
        }

        .banner-top {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        /* 3D-Style Patrick Graphic Avatar */
        .patrick-3d-avatar {
            width: 75px;
            height: 85px;
            flex-shrink: 0;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.2));
        }

        .title-area h1 {
            font-size: clamp(1.3rem, 4vw, 1.6rem);
            color: #0369a1;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 6px;
        }

        .title-area p {
            font-size: clamp(0.8rem, 3vw, 0.85rem);
            color: #0369a1;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .banner-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .action-btn {
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
            flex: 1;
        }

        .btn-lang {
            background: #0284c7;
            color: white;
        }

        .btn-new {
            background: #4f46e5;
            color: white;
        }

        /* Controls Card */
        .controls-card {
            background: #e0f2fe;
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 2px solid #bae6fd;
        }

        .search-box {
            background: white;
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1.5px solid #7dd3fc;
        }

        .search-box input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 0.95rem;
            color: var(--text-dark);
        }

        .filter-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-label {
            font-weight: 700;
            color: #0369a1;
            font-size: 0.9rem;
        }

        .filter-select {
            background: white;
            border: 1.5px solid #7dd3fc;
            border-radius: 14px;
            padding: 8px 14px;
            font-weight: 600;
            color: var(--text-dark);
            outline: none;
            width: 100%;
            cursor: pointer;
        }

        /* Note Cards */
        .note-card {
            background: #e0f2fe;
            border-radius: 24px;
            padding: 20px;
            border: 2px solid #bae6fd;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .mood-tag {
            background: white;
            padding: 6px 14px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 0.85rem;
            color: #0284c7;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .note-date {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .note-title {
            font-size: 1.2rem;
            color: #0369a1;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .note-body {
            font-size: 0.95rem;
            color: #334155;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .read-more {
            font-size: 0.85rem;
            font-style: italic;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Modal Writing Box */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 440px;
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-content textarea {
            width: 100%;
            height: 120px;
            border: 1.5px solid #bae6fd;
            border-radius: 12px;
            padding: 10px;
            outline: none;
            resize: vertical;
        }
    </style>
</head>
<body>

    <!-- Reusable Colored Vector Icon Templates -->
    <svg style="display:none;">
        <defs>
            <!-- Colored Starfish Icon -->
            <g id="icon-starfish">
                <path d="M12 2l2.4 7.4h7.8l-6.3 4.6 2.4 7.4-6.3-4.6-6.3 4.6 2.4-7.4-6.3-4.6h7.8z" fill="#ff7675" stroke="#d63031" stroke-width="1.5"/>
            </g>
            <!-- Colored Search Icon -->
            <g id="icon-search">
                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="#0984e3"/>
            </g>
            <!-- Colored Edit Icon -->
            <g id="icon-edit">
                <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="#fdcb6e"/>
            </g>
            <!-- Colored Eye Icon -->
            <g id="icon-eye">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="#74b9ff"/>
            </g>
            <!-- Colored Translate Icon -->
            <g id="icon-translate">
                <path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z" fill="#55efc4"/>
            </g>
            <!-- Colored Heart Icon -->
            <g id="icon-heart">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#74b9ff"/>
            </g>
        </defs>
    </svg>

    <div class="container">
        
        <!-- Top Banner -->
        <div class="banner-card">
            <div class="banner-top">
                <!-- 3D Vector Patrick Star Graphic -->
                <svg class="patrick-3d-avatar" viewBox="0 0 100 120">
                    <defs>
                        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffb3ba"/>
                            <stop offset="50%" stop-color="#ff85a2"/>
                            <stop offset="100%" stop-color="#e64980"/>
                        </linearGradient>
                        <linearGradient id="shortsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#ccff33"/>
                            <stop offset="100%" stop-color="#9ef01a"/>
                        </linearGradient>
                    </defs>
                    <!-- Body Base -->
                    <path d="M 50 5 Q 70 30 85 45 Q 95 65 78 82 L 22 82 Q 5 65 15 45 Q 30 30 50 5 Z" fill="url(#bodyGrad)" stroke="#c2255c" stroke-width="2"/>
                    <!-- Arms -->
                    <path d="M 18 48 Q 5 58 10 70 Q 20 68 25 58 Z" fill="url(#bodyGrad)" stroke="#c2255c" stroke-width="1.5"/>
                    <path d="M 82 48 Q 95 58 90 70 Q 80 68 75 58 Z" fill="url(#bodyGrad)" stroke="#c2255c" stroke-width="1.5"/>
                    <!-- 3D Eyes -->
                    <ellipse cx="42" cy="38" rx="6" ry="9" fill="#ffffff" stroke="#333" stroke-width="1"/>
                    <ellipse cx="58" cy="38" rx="6" ry="9" fill="#ffffff" stroke="#333" stroke-width="1"/>
                    <ellipse cx="44" cy="38" rx="2.5" ry="4" fill="#000000"/>
                    <ellipse cx="56" cy="38" rx="2.5" ry="4" fill="#000000"/>
                    <!-- Eyebrows -->
                    <path d="M 36 26 Q 42 24 46 27" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round"/>
                    <path d="M 54 27 Q 58 24 64 26" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round"/>
                    <!-- Smile -->
                    <path d="M 40 50 Q 50 58 60 50" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                    <!-- Green Shorts with Purple Flowers -->
                    <path d="M 22 80 L 78 80 L 75 105 Q 50 110 25 105 Z" fill="url(#shortsGrad)" stroke="#70e000" stroke-width="2"/>
                    <path d="M 32 88 Q 36 84 40 88 Q 42 92 38 95 Q 32 94 32 88 Z" fill="#b5179e"/>
                    <path d="M 60 92 Q 64 88 68 92 Q 70 96 66 99 Q 60 98 60 92 Z" fill="#b5179e"/>
                </svg>

                <div class="title-area">
                    <h1 id="banner-title">派大星的蓝色手帐</h1>
                    <p id="banner-quote">
                        “蛋黄酱是乐器吗？不是，但记录心情是！” 
                        <svg class="ocean-icon"><use href="#icon-heart"/></svg>
                    </p>
                </div>
            </div>
            <div class="banner-actions">
                <button class="action-btn btn-lang" onclick="toggleLang()" id="lang-btn">
                    <svg class="ocean-icon"><use href="#icon-translate"/></svg> English
                </button>
                <button class="action-btn btn-new" onclick="openModal()" id="new-btn">
                    <svg class="ocean-icon"><use href="#icon-edit"/></svg> 新建笔记
                </button>
            </div>
        </div>

        <!-- Search & Filter -->
        <div class="controls-card">
            <div class="search-box">
                <svg class="ocean-icon"><use href="#icon-search"/></svg>
                <input type="text" id="search-input" placeholder="搜索笔记或关键词..." oninput="renderNotes()">
            </div>
            <div class="filter-row">
                <span class="filter-label" id="mood-label">心情:</span>
                <select class="filter-select" id="mood-filter" onchange="renderNotes()">
                    <option value="all">All Notes</option>
                    <option value="Starry">Starry</option>
                    <option value="Happy">Happy</option>
                    <option value="Calm">Calm</option>
                </select>
            </div>
        </div>

        <!-- Notes Area -->
        <div id="notes-list" style="display:flex; flex-direction:column; gap:16px;"></div>

    </div>

    <!-- Create Note Modal -->
    <div class="modal" id="note-modal">
        <div class="modal-content">
            <h3 style="color:#0369a1;">New Note / 新建笔记</h3>
            <input type="text" id="new-title" placeholder="Title / 标题" style="padding:8px; border-radius:8px; border:1px solid #bae6fd; outline:none;">
            <textarea id="new-body" placeholder="Write here... / 在这里写入..."></textarea>
            <div style="display:flex; gap:10px;">
                <button class="action-btn btn-lang" style="flex:1;" onclick="saveNote()">Save</button>
                <button class="action-btn" style="background:#e2e8f0; color:#334155; flex:1;" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let currentLang = 'zh';
        let notes = [
            {
                id: 1,
                mood: 'Starry',
                date: '2026年10月19日 22:55',
                title: 'Welcome to your Patrick...',
                body: 'Hi friend! Welcome to your cozy personal notebook. Here you can write down your thoughts, daily memories, or secret formulas!...'
            }
        ];

        function toggleLang() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            document.getElementById('banner-title').innerText = currentLang === 'zh' ? '派大星的蓝色手帐' : "Patrick's Blue Notes";
            document.getElementById('banner-quote').innerHTML = currentLang === 'zh' 
                ? '“蛋黄酱是乐器吗？不是，但记录心情是！” <svg class="ocean-icon"><use href="#icon-heart"/></svg>' 
                : '"Is mayonnaise an instrument? No, but recording memories is!" <svg class="ocean-icon"><use href="#icon-heart"/></svg>';
            document.getElementById('lang-btn').innerHTML = currentLang === 'zh' 
                ? '<svg class="ocean-icon"><use href="#icon-translate"/></svg> English' 
                : '<svg class="ocean-icon"><use href="#icon-translate"/></svg> 中文';
            document.getElementById('new-btn').innerHTML = currentLang === 'zh' 
                ? '<svg class="ocean-icon"><use href="#icon-edit"/></svg> 新建笔记' 
                : '<svg class="ocean-icon"><use href="#icon-edit"/></svg> New Note';
            document.getElementById('search-input').placeholder = currentLang === 'zh' ? '搜索笔记或关键词...' : 'Search notes or keywords...';
            document.getElementById('mood-label').innerText = currentLang === 'zh' ? '心情:' : 'Mood:';
        }

        function openModal() { document.getElementById('note-modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('note-modal').style.display = 'none'; }

        function saveNote() {
            const title = document.getElementById('new-title').value.trim();
            const body = document.getElementById('new-body').value.trim();
            if (!title || !body) return;

            notes.unshift({
                id: Date.now(),
                mood: 'Starry',
                date: new Date().toLocaleString(),
                title: title,
                body: body
            });

            document.getElementById('new-title').value = '';
            document.getElementById('new-body').value = '';
            closeModal();
            renderNotes();
        }

        function renderNotes() {
            const container = document.getElementById('notes-list');
            const search = document.getElementById('search-input').value.toLowerCase();
            const filter = document.getElementById('mood-filter').value;

            const filtered = notes.filter(n => {
                const matchesSearch = n.title.toLowerCase().includes(search) || n.body.toLowerCase().includes(search);
                const matchesMood = filter === 'all' || n.mood === filter;
                return matchesSearch && matchesMood;
            });

            container.innerHTML = filtered.map(n => `
                <div class="note-card">
                    <div class="note-header">
                        <div class="mood-tag">
                            <svg class="ocean-icon"><use href="#icon-starfish"/></svg>
                            ${n.mood}
                        </div>
                        <div class="note-date">${n.date}</div>
                    </div>
                    <div class="note-title">${n.title}</div>
                    <div class="note-body">${n.body}</div>
                    <div class="read-more">
                        <span>Read more...</span>
                        <svg class="ocean-icon"><use href="#icon-eye"/></svg>
                    </div>
                </div>
            `).join('');
        }

        renderNotes();
    </script>
</body>
</html>
